[project]
name = "settl-agent-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jebin1727", email = "jebinjoel16y@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "langchain>=0.3.23",
    "langchain-google-genai>=2.1.12",
    "langchain-ollama>=0.3.10",
    "paypal-agent-toolkit>=1.11.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "redis>=5.3.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# The global `engine` in src/core/database.py is a module-level singleton
# bound to whichever event loop first uses it. A session-scoped loop keeps
# that assumption valid across the whole test run instead of breaking on
# pytest-asyncio's default per-test loop (which produced "Event loop is
# closed" errors on asyncpg connection teardown between tests).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100

